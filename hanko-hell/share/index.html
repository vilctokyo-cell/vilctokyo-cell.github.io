<style>
  :root{
    --bg:#171d20; --paper:#e8e3d3; --ink:#2b2620;
    --stamp-red:#c1272d; --warn:#e2b93b; --mint:#8fd9c4;
    --foam:#eef0ee; --foam-dim:#a7ada9;
    --shadow:0 14px 32px rgba(0,0,0,0.5);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:32px 16px;
    background:
      radial-gradient(circle at 20% 15%, rgba(238,240,238,0.04), transparent 45%),
      var(--bg);
    color:var(--foam);
    font-family:'Zen Kaku Gothic New',sans-serif;
  }
  .card{
    background:rgba(23,29,32,0.7);
    border:1px solid rgba(238,240,238,0.14);
    border-radius:26px;
    box-shadow:var(--shadow);
    max-width:420px; width:100%;
    padding:36px 28px 30px;
    text-align:center;
  }
  .tag{
    display:inline-block; font-size:.72rem; font-weight:700; letter-spacing:.1em;
    color:var(--ink); background:var(--warn);
    padding:6px 16px; border-radius:999px; margin-bottom:18px;
  }
  .stamp{
    width:96px; height:96px; margin:0 auto 14px;
    border-radius:50%;
    border:5px solid var(--stamp-red);
    display:flex; align-items:center; justify-content:center;
    transform:rotate(-10deg);
    box-shadow:inset 0 0 0 3px rgba(193,39,45,0.35);
  }
  .stamp span{
    font-family:'Zen Kaku Gothic New',sans-serif;
    font-weight:900; font-size:1.5rem; color:var(--stamp-red);
  }
  h1{
    font-weight:900; font-size:1.9rem; color:var(--foam); margin:6px 0 12px;
  }
  p{font-size:.92rem; color:var(--foam-dim); line-height:1.8; margin:0 0 28px;}
  .cta{
    display:inline-block; font-size:1rem; font-weight:700; color:#1c0d0e; text-decoration:none;
    background:linear-gradient(180deg,#e2555c,var(--stamp-red));
    padding:14px 36px; border-radius:999px;
    box-shadow:0 8px 22px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .cta:active{transform:translateY(2px);}
  .brand{margin-top:22px; font-size:.68rem; font-weight:700; letter-spacing:.08em; color:var(--foam-dim);}
</style>

  <div class="card">

  </div>
